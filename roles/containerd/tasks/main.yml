---
# tasks file for containerd

- name: Install Podman and related packages
  ansible.builtin.include_tasks: podman.yml
  when: containerd_use_podman | default(true)
  tags: ["podman", "containerd"]

- name: Install Docker and related packages
  ansible.builtin.include_tasks: docker.yml
  when: containerd_use_docker | default(true)
  tags: ["docker", "containerd"]
