---
# defaults file for b08x.devworkstation.base

# Variable that will be displayed in debug output
# This demonstrates proper role variable naming with the 'run_' prefix
base_my_variable: "default_value"

base_go_version: 1.27.1

base_uv_python_version: 3.13

# rbenv configuration
base_install_rbenv: true
base_rbenv_ruby_version: "4.0.4"
base_rbenv_rubygems_version: "4.0.20"
base_rbenv_configure_opts: "--with-openssl-dir=/usr"
base_rbenv_gems:
  - solargraph
  - ruby-lsp
  - rubocop
