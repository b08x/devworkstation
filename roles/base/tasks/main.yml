---
# tasks file for b08x.devworkstation.base

- name: Starting base tasks
  ansible.builtin.debug:
    msg: "Starting base tasks"
  tags: ["base", "always"]

- name: Include distribution package variables
  ansible.builtin.include_vars: "{{ ansible_distribution }}.yml"
  tags: ["packages", "distro"]

# ----------------------------------------------------------------------------
# DNF Performance Optimization
# ----------------------------------------------------------------------------

- name: Include DNF configuration tasks
  ansible.builtin.include_tasks: dnf.yml
  tags: ["dnf", "base", "repos"]

# ----------------------------------------------------------------------------
# Repository Configuration
# ----------------------------------------------------------------------------

- name: Include Distribution Specific Repository Tasks
  ansible.builtin.include_tasks: "distro/{{ ansible_distribution }}.yml"
  when:
    - enable_third_party_repos | default(true) | bool
  tags: ["repos", "base"]

- name: Install Base packages
  tags: ["packages", "base"]
  block:
    - name: Install Base packages
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
        allowerasing: true
      with_items:
        - "{{ base_packages }}"

  rescue:
    - name: Handle package installation failures
      ansible.builtin.debug:
        msg: "Failed to install some Base packages. Please check the error message above."

- name: Enable and Start ssh service
  ansible.builtin.systemd:
    name: sshd
    enabled: true
    state: restarted

- name: Configure zram-generator
  ansible.builtin.copy:
    content: |
      [zram0]
      zram-size = {{ (ansible_memtotal_mb | int) // 2 }}
      compression-algorithm = zstd
      swap-priority = 100
    dest: /etc/systemd/zram-generator.conf
    mode: "0644"
    backup: true
  notify:
    - Restart zram service

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Flush handlers meow
  ansible.builtin.meta: flush_handlers

- name: Include gitflow installation tasks
  ansible.builtin.include_tasks: gitflow.yml
  tags: ["gitflow", "base"]

- name: Include cargo installation tasks
  ansible.builtin.include_tasks: cargo.yml
  when: base_install_cargo | default(false) | bool
  tags: ["cargo", "base"]

- name: Include Go installation tasks
  ansible.builtin.include_tasks: go.yml
  when: base_install_go | default(true) | bool
  tags: ["go", "base"]

- name: Include Intel installation tasks
  ansible.builtin.include_tasks: intel.yml
  tags: ["intel", "base"]

- name: Include fzf installation tasks
  ansible.builtin.include_tasks: fzf.yml
  tags: ["fzf", "base"]

- name: Include inxi installation tasks
  ansible.builtin.include_tasks: inxi.yml
  tags: ["inxi", "base"]

- name: Include Ranger installation tasks
  ansible.builtin.include_tasks: ranger.yml
  tags: ["ranger", "base"]

- name: Include Zsh installation tasks
  ansible.builtin.include_tasks: zsh.yml
  tags: ["zsh", "base"]

- name: Include pip configuration tasks
  ansible.builtin.include_tasks: pip.yml
  tags: ["pip", "base"]

- name: Include uv configuration tasks
  ansible.builtin.include_tasks: uv.yml
  tags: ["uv", "base"]

- name: Include Homebrew configuration tasks
  ansible.builtin.include_tasks: homebrew.yml
  when: ansible_distribution == 'Fedora'
  tags: ["homebrew", "base"]
