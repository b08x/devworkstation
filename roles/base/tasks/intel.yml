---
- name: Install Intel Graphics Drivers
  tags: ["intel"]
  block:
    - name: Install Intel Graphics Drivers packages
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
      loop:
        - intel-gmmlib
        - intel-gpu-firmware
        - intel-vpl-gpu-rt
        - libva-intel-driver
        - intel-vsc-firmware

  rescue:
    - name: Log Intel Graphics Drivers setup failure
      ansible.builtin.debug:
        msg: >
          Failed to set up Intel Graphics Drivers.
          Error details: {{ ansible_failed_result | default('Unknown error') }}
          This might be due to network connectivity issues or repository availability.
      tags: ["intel_graphics_setup"]

    - name: Mark Intel Graphics Drivers setup as failed
      ansible.builtin.set_fact:
        base_intel_graphics_setup_failed: true
      tags: ["intel_graphics_setup"]

- name: Install Intel oneAPI Toolkit
  when: intel_oneapi_install | default(false)
  tags: ["intel_oneapi"]
  block:
    - name: Import Intel oneAPI GPG Key
      ansible.builtin.rpm_key:
        state: present
        key: https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
        validate_certs: true

    - name: Add Intel openAPI Repository
      ansible.builtin.yum_repository:
        name: oneAPI
        description: "Intel® oneAPI repository"
        baseurl: https://yum.repos.intel.com/oneapi
        enabled: true
        gpgcheck: true
        gpgkey: https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB

    - name: Update Package Cache
      ansible.builtin.dnf:
        update_cache: true

    - name: Install Intel oneAPI MKL
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
      loop:
        - intel-oneapi-mkl-devel
        - intel-oneapi-common-vars
        - intel-oneapi-runtime-dpcpp-sycl-core

    - name: Create oneAPI Environment Profile Script
      ansible.builtin.copy:
        dest: /etc/profile.d/intel-oneapi.sh
        content: |
          #!/bin/bash
          # Initialize Intel oneAPI environment variables on login
          if [ -f /opt/intel/oneapi/setvars.sh ]; then
              source /opt/intel/oneapi/setvars.sh --force > /dev/null 2>&1
          fi
        mode: "0755"
        owner: root
        group: root

  rescue:
    - name: Log Intel oneAPI setup failure
      ansible.builtin.debug:
        msg: >
          Failed to set up Intel oneAPI Toolkit.
          Error details: {{ ansible_failed_result | default('Unknown error') }}
          This might be due to network connectivity issues or repository availability.
      tags: ["intel_oneapi_setup"]

    - name: Mark Intel oneAPI setup as failed
      ansible.builtin.set_fact:
        base_intel_oneapi_setup_failed: true
      tags: ["intel_oneapi_setup"]
