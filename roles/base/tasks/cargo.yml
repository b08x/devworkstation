---

- name: Download rustup-init script
  ansible.builtin.get_url:
    url: https://sh.rustup.rs
    dest: /tmp/rustup-init.sh
    mode: "0755"
  become: false

- name: Run rustup-init
  ansible.builtin.command:
    cmd: /tmp/rustup-init.sh -y
  become: false
  register: base_rustup_output
  changed_when: "'Rust is installed now' not in base_rustup_output.stdout"
  tags: ["rust", "cargo", "base"]

- name: Install cargo packages
  tags: ["cargo", "base"]
  become: false
  block:
    - name: Install cargo packages
      community.general.cargo:
        name: "{{ item }}"
        state: present
      loop:
        - bottom
        - choose
        - exa
        - git-cliff
        - gping
        - ripgrep_all
        - sd

  rescue:
    - name: Handle cargo package installation failures
      ansible.builtin.debug:
        msg: "Failed to install some cargo packages. Please check the error message above."

- name: Install gitui with cargo
  tags: ["cargo", "base"]
  become: false
  block:
    - name: Install gitui
      community.general.cargo:
        name: gitui
        state: present
        locked: true

  rescue:
    - name: Handle gitui installation failure
      ansible.builtin.debug:
        msg: "Failed to install gitui. Please check the error message above."
