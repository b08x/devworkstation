---
- name: Ensure dnf-plugins-core is installed
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Import Docker GPG key
  ansible.builtin.rpm_key:
    key: "{{ docker_gpg_key_url }}"
    state: present

- name: Add Docker CE repository
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable - x86_64
    baseurl: "https://download.docker.com/linux/alma/$releasever/$basearch/stable"
    enabled: true
    gpgcheck: true
    gpgkey: "{{ docker_gpg_key_url }}"
    state: present

# - name: Remove conflicting packages if enabled
#   ansible.builtin.dnf:
#     name:
#       - podman
#       - docker
#       - docker-common
#       - docker
#       - docker-engine
#     state: absent
#   when: docker_remove_conflicting_packages

- name: Install Docker packages
  ansible.builtin.dnf:
    name: "{{ docker_packages | map('regex_replace', '^(.*)$', '\\1-' + docker_version) | list if docker_version else docker_packages }}"
    state: present
    update_cache: true
  notify: Restart Docker

# - name: Add specified users to the docker group
#   ansible.builtin.user:
#     name: "{{ item }}"
#     groups: docker
#     append: true
#   loop: "{{ docker_users }}"
#   when: docker_users | length > 0

- name: Configure the Docker daemon (/etc/docker/daemon.json)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  when: docker_daemon_config | length > 0
  notify: Restart Docker

# - name: Set Docker Storage Location
#   ansible.builtin.lineinfile:
#     path: "/usr/lib/systemd/system/docker.service"
#     regexp: "^ExecStart=/usr/bin/dockerd -H fd://"
#     line: "ExecStart=/usr/bin/dockerd --data-root {{ docker_storage }} -H fd://"
#   when: docker_storage is defined

- name: Disable Overlay Redirect
  ansible.builtin.copy:
    content: |
      options overlay metacopy=off redirect_dir=off
    dest: "/etc/modprobe.d/disable-overlay-redirect-dir.conf"
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
