---
# tasks file for libvirt (Fedora)

- name: Install virtualization packages
  ansible.builtin.dnf:
    name: "{{ libvirt_packages }}"
    state: present
  when: ansible_distribution == "Fedora"

- name: Install virtualization packages
  ansible.builtin.dnf:
    name: "@virtualization-host-environment"
    state: present
  when: ansible_distribution == "AlmaLinux"

- name: Configure libvirtd
  ansible.builtin.template:
    src: etc/libvirt/libvirtd.conf.j2
    dest: /etc/libvirt/libvirtd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart libvirtd

- name: Configure QEMU bridge access
  ansible.builtin.copy:
    src: etc/qemu/bridge.conf
    dest: /etc/qemu/bridge.conf
    owner: root
    group: root
    mode: "0644"
  when: ansible_distribution == "Fedora"

- name: Configure QEMU bridge access
  ansible.builtin.copy:
    src: etc/qemu/bridge.conf
    dest: /etc/qemu-kvm/bridge.conf
    owner: root
    group: root
    mode: "0644"
  when: ansible_distribution == "AlmaLinux"

- name: Disable lvmetad for libvirt storage pools
  ansible.builtin.lineinfile:
    path: /etc/lvm/lvm.conf
    regexp: '^\s*use_lvmetad\s*='
    line: "    use_lvmetad = 0"
    owner: root
    group: root
    mode: "0644"
  when: libvirt_configure_lvm

- name: Add specified users to the libvirt group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "libvirt"
    append: true
  loop: "{{ libvirt_users }}"
  when: libvirt_users | length > 0

- name: Ensure libvirt service is started and enabled
  ansible.builtin.systemd:
    name: "{{ libvirt_service }}"
    enabled: "{{ libvirt_service_enabled }}"
    state: started

- name: Add user to qemu group for KVM access
  ansible.builtin.user:
    name: "{{ user.name }}"
    groups: "{{ item }}"
    append: true
  loop:
    - libvirt
    - qemu
