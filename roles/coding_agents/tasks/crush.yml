---
# Crush — go install + config deployment (crushrc with embedded MCP)

# -- Uninstall --
- name: Uninstall Crush
  when:
    - coding_agents_crush_state == 'present'
    - coding_agents_uninstall | default(false) | bool
  tags: ["crush", "uninstall"]
  block:
    - name: Remove Crush CLI binary
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/go/bin/crush"
        state: absent

    - name: Remove Crush config directory
      ansible.builtin.file:
        path: "{{ coding_agents_crush_config_dir }}"
        state: absent

# -- Install --
- name: Install Crush
  when:
    - coding_agents_crush_state == 'present'
    - not (coding_agents_uninstall | default(false) | bool)
  tags: ["crush", "install"]
  block:
    - name: Install Crush CLI
      ansible.builtin.command:
        cmd: "go install {{ coding_agents_crush_go_package }}"
        creates: "{{ ansible_user_dir }}/go/bin/crush"
      environment:
        GOPATH: "{{ ansible_user_dir }}/go"
      when: coding_agents_go_check.rc == 0

    - name: Crush CLI not installed (go missing)
      ansible.builtin.debug:
        msg: "WARNING: go not found — cannot install Crush CLI. Install golang via the base role."
      when: coding_agents_go_check.rc != 0

# -- Config --
- name: Configure Crush
  when:
    - coding_agents_crush_state == 'present'
    - not (coding_agents_uninstall | default(false) | bool)
  tags: ["crush", "config"]
  block:
    - name: Ensure Crush config directory exists
      ansible.builtin.file:
        path: "{{ coding_agents_crush_config_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy Crush config
      ansible.builtin.template:
        src: crush/crushrc.j2
        dest: "{{ coding_agents_crush_config_dir }}/crushrc"
        backup: true
        mode: "0644"
      tags: ["mcp"]

    - name: Ensure Crush agents directory exists
      ansible.builtin.file:
        path: "{{ coding_agents_crush_agents_dir }}"
        state: directory
        mode: "0755"
