---
# Task file for Crush configuration

- name: Ensure Crush config directory exists
  ansible.builtin.file:
    path: "{{ coding_agents_crush_config_dir }}"
    state: directory
    mode: "0755"

- name: Ensure Crush skills directory exists
  ansible.builtin.file:
    path: "{{ coding_agents_crush_skills_dir }}"
    state: directory
    mode: "0755"

- name: Ensure Crush agents directory exists
  ansible.builtin.file:
    path: "{{ coding_agents_crush_agents_dir }}"
    state: directory
    mode: "0755"

- name: Deploy Crush MCP server configuration
  ansible.builtin.copy:
    dest: "{{ coding_agents_crush_config_dir }}/mcp.json"
    content: "{{ coding_agents_crush_mcp_servers | to_nice_json }}"
    mode: "0644"
  when: coding_agents_crush_mcp_servers | length > 0
