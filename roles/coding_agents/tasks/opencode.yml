---
# Task file for OpenCode configuration

- name: Ensure OpenCode config directory exists
  ansible.builtin.file:
    path: "{{ coding_agents_opencode_config_dir }}"
    state: directory
    mode: "0755"

- name: Ensure OpenCode skills directory exists
  ansible.builtin.file:
    path: "{{ coding_agents_opencode_skills_dir }}"
    state: directory
    mode: "0755"

- name: Ensure OpenCode agents directory exists
  ansible.builtin.file:
    path: "{{ coding_agents_opencode_agents_dir }}"
    state: directory
    mode: "0755"

- name: Deploy OpenCode MCP server configuration
  ansible.builtin.copy:
    dest: "{{ coding_agents_opencode_config_dir }}/mcp.json"
    content: "{{ coding_agents_opencode_mcp_servers | to_nice_json }}"
    mode: "0644"
  when: coding_agents_opencode_mcp_servers | length > 0
