---
# Task file for Vibe configuration

- name: Ensure Vibe config directory exists
  ansible.builtin.file:
    path: "{{ coding_agents_vibe_config_dir }}"
    state: directory
    mode: "0755"

- name: Ensure Vibe skills directory exists
  ansible.builtin.file:
    path: "{{ coding_agents_vibe_skills_dir }}"
    state: directory
    mode: "0755"

- name: Ensure Vibe agents directory exists
  ansible.builtin.file:
    path: "{{ coding_agents_vibe_agents_dir }}"
    state: directory
    mode: "0755"

- name: Deploy Vibe MCP server configuration
  ansible.builtin.copy:
    dest: "{{ coding_agents_vibe_config_dir }}/mcp.json"
    content: "{{ coding_agents_vibe_mcp_servers | to_nice_json }}"
    mode: "0644"
  when: coding_agents_vibe_mcp_servers | length > 0
