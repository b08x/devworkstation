---
# Vibe — npm install + config deployment (config.toml with embedded MCP)

# -- Uninstall --
- name: Uninstall Vibe
  when:
    - coding_agents_vibe_state == 'present'
    - coding_agents_uninstall | default(false) | bool
  tags: ["vibe", "uninstall"]
  block:
    - name: Check whether Vibe CLI is installed
      ansible.builtin.command: "npm list -g --depth=0 {{ coding_agents_vibe_npm_package }}"
      register: coding_agents_vibe_npm_package_check
      changed_when: false
      failed_when: false

    - name: Uninstall Vibe CLI
      ansible.builtin.command: "npm uninstall -g {{ coding_agents_vibe_npm_package }}"
      when: coding_agents_vibe_npm_package_check.rc == 0
      failed_when: false
      register: coding_agents_vibe_uninstall
      changed_when: >-
        coding_agents_vibe_uninstall.rc == 0 and
        ('removed' in (coding_agents_vibe_uninstall.stdout | default('') | lower))

    - name: Remove Vibe config directory
      ansible.builtin.file:
        path: "{{ coding_agents_vibe_config_dir }}"
        state: absent

# -- Install --
- name: Install Vibe
  when:
    - coding_agents_vibe_state == 'present'
    - not (coding_agents_uninstall | default(false) | bool)
  tags: ["vibe", "install"]
  block:
    - name: Check whether Vibe CLI is installed
      ansible.builtin.command: "npm list -g --depth=0 {{ coding_agents_vibe_npm_package }}"
      register: coding_agents_vibe_npm_package_check
      changed_when: false
      failed_when: false

    - name: Install Vibe CLI
      ansible.builtin.command: "npm install -g {{ coding_agents_vibe_npm_package }}"
      when:
        - coding_agents_npm_check.rc == 0
        - coding_agents_vibe_npm_package_check.rc != 0
      changed_when: coding_agents_vibe_npm_package_check.rc != 0

    - name: Vibe CLI not installed (npm missing)
      ansible.builtin.debug:
        msg: "WARNING: npm not found — cannot install Vibe CLI. Install nodejs/npm via the base role."
      when: coding_agents_npm_check.rc != 0

# -- Config --
- name: Configure Vibe
  when:
    - coding_agents_vibe_state == 'present'
    - not (coding_agents_uninstall | default(false) | bool)
  tags: ["vibe", "config"]
  block:
    - name: Ensure Vibe config directory exists
      ansible.builtin.file:
        path: "{{ coding_agents_vibe_config_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy Vibe config
      ansible.builtin.template:
        src: vibe/config.toml.j2
        dest: "{{ coding_agents_vibe_config_dir }}/config.toml"
        backup: true
        mode: "0644"
      tags: ["mcp"]

    - name: Ensure Vibe agents directory exists
      ansible.builtin.file:
        path: "{{ coding_agents_vibe_agents_dir }}"
        state: directory
        mode: "0755"
